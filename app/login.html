<script>
(function(){
  try{
    var k="cc-theme";
    try{
      localStorage.removeItem(k);
      localStorage.removeItem("cc-lat");
      localStorage.removeItem("cc-lng");
    }catch(e){}
    var p=null;
    try{ p=sessionStorage.getItem(k); }catch(e){}
    if(p!=="light"&&p!=="dark") p=null;
    function day(){
      var lat=39.9042, lng=116.4074;
      var rad=Math.PI/180, dayMs=8.64e7, J1970=2440588, J2000=2451545, e=rad*23.4397;
      var now=new Date();
      var ymd=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).format(now);
      var noon=new Date(ymd+"T12:00:00+08:00");
      var toJ=function(d){return d/dayMs-0.5+J1970;};
      var fromJ=function(j){return new Date((j+0.5-J1970)*dayMs);};
      var d=toJ(noon)-J2000;
      var lw=-lng*rad, phi=lat*rad;
      var n=Math.round(d-0.0009-lw/(2*Math.PI));
      var ds=0.0009+lw/(2*Math.PI)+n;
      var M=rad*(357.5291+0.98560028*ds);
      var C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
      var L=M+C+rad*102.9372+Math.PI;
      var dec=Math.asin(Math.sin(L)*Math.sin(e));
      var Jnoon=J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
      var h0=-0.833*rad;
      var cosH=(Math.sin(h0)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec));
      if(cosH>1) return false; if(cosH<-1) return true;
      var w=Math.acos(cosH);
      var a=0.0009+(w+lw)/(2*Math.PI)+n;
      var Jset=J2000+a+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
      var Jrise=Jnoon-(Jset-Jnoon);
      return now>=fromJ(Jrise)&&now<fromJ(Jset);
    }
    var t=p||(day()?"light":"dark");
    var root=document.documentElement;
    root.dataset.theme=t;
    root.dataset.themePref=p||"auto";
    root.style.colorScheme=t;
  }catch(e){
    document.documentElement.dataset.theme="dark";
    document.documentElement.dataset.themePref="auto";
  }
})();
</script>

<script>
(function(){
  document.addEventListener("click",function(e){
    if(e.defaultPrevented)return;
    if(e.button&&e.button!==0)return;
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    var a=e.target.closest&&e.target.closest("a[href]");
    if(!a||a.target==="_blank"||a.hasAttribute("download"))return;
    var href=a.getAttribute("href")||"";
    if(!href||href.charAt(0)==="#"||href.indexOf("mailto:")===0||href.indexOf("tel:")===0)return;
    var u;try{u=new URL(href,location.href);}catch(err){return;}
    if(u.origin!==location.origin)return;
    var name=(u.pathname.replace(/\/+$/,"").split("/").pop()||"index.html");
    if(!(u.pathname==="/"||name===""||name==="index.html"||/^(apply|login|gathering-001)\.html$/i.test(name)))return;
    e.preventDefault();
    if(window.CC&&CC.BGM&&CC.BGM.go){CC.BGM.go(u.href);return;}
    window.__ccPendingNav=u.href;
  },true);
  var a=document.getElementById("bgm");
  if(!a)return;
  try{
    if(localStorage.getItem("cc-bgm")==="off")return;
    if(!(localStorage.getItem("cc-bgm")==="on"||sessionStorage.getItem("cc-bgm-playing")==="1"))return;
    var t=parseFloat(sessionStorage.getItem("cc-bgm-t")||"0")||0;
    var w=parseInt(sessionStorage.getItem("cc-bgm-wall")||"0",10);
    if(w) t+=Math.min(6,Math.max(0,(Date.now()-w)/1000));
    a.volume=0.42;
    var go=function(){
      try{
        var d=a.duration;
        if(isFinite(d)&&d>0) t=((t%d)+d)%d;
        if(Math.abs((a.currentTime||0)-t)>0.15) a.currentTime=Math.max(0,t);
      }catch(e){}
      var p=a.play();
      if(p&&p.catch)p.catch(function(){});
    };
    if(a.readyState>=1) go();
    else a.addEventListener("loadedmetadata",go,{once:true});
  }catch(e){}
})();
</script>

        通行码 <code style="color:var(--cyan)">CAST-DEMO</code>
        · <button type="button" id="fillDemo" class="btn btn-ghost" style="padding:4px 10px;font-size:12px;margin-left:6px">一键填入</button>

<script>
CC.BGM.init({ mode: "button", toggleId: "bgmBtn", gestureKick: true });
const params = new URLSearchParams(location.search);
const msg = document.getElementById("msg");
const handleInput = document.querySelector('input[name="handle"]');
const passInput = document.querySelector('input[name="passcode"]');

document.getElementById("fillDemo").addEventListener("click", () => {
  handleInput.value = "demo_caster";
  passInput.value = "CAST-DEMO";
  msg.className = "form-msg";
  msg.textContent = "已填入演示账号，点「登录」即可";
});

if (params.get("err")) {
  msg.className = "form-msg err";
  msg.textContent = "登录暂不可用，请稍后重试，或确认通行码是否正确。";
}

CC.authMe().then(me => {
  if (me.auth) {
    msg.className = "form-msg ok";
    msg.textContent = `已登录为 ${me.user.name}，正在跳转…`;
    CC.BGM.persist?.(document.getElementById("bgm"));
    const next = params.get("next") || "gathering-001.html";
    if (CC.BGM.go) CC.BGM.go(next);
    else location.href = next;
  }
}).catch(() => {});

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "form-msg";
  msg.textContent = "登录中…";
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  try {
    const data = await CC.api("/api/auth/login", { method: "POST", body: JSON.stringify(body) });
    msg.className = "form-msg ok";
    msg.textContent = `欢迎，${data.user.name}`;
    CC.BGM.persist?.(document.getElementById("bgm"));
    const next = params.get("next") || "gathering-001.html";
    if (CC.BGM.go) CC.BGM.go(next);
    else location.href = next;
  } catch (err) {
    msg.className = "form-msg err";
    msg.textContent = err.message || "登录失败。请确认通过 http://localhost:3000 打开本页（不要直接双击 HTML）。";
  }
});
</script>
