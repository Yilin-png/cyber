<!doctype html>
<html lang="zh-CN">
<head>
<script>
(function(){
  try{
    var k="cc-theme", purge="cc-theme-purged-v3";
    if(!localStorage.getItem(purge)){
      localStorage.removeItem(k);
      localStorage.removeItem("cc-lat");
      localStorage.removeItem("cc-lng");
      localStorage.setItem(purge,"1");
    }
    var p=localStorage.getItem(k);
    if(p!=="light"&&p!=="dark") p=null;
    function day(){
      var lat=39.9042, lng=116.4074;
      var rad=Math.PI/180, dayMs=8.64e7, J1970=2440588, J2000=2451545, e=rad*23.4397;
      var now=new Date();
      var toJ=function(d){return d/dayMs-0.5+J1970;};
      var fromJ=function(j){return new Date((j+0.5-J1970)*dayMs);};
      var d=toJ(now)-J2000;
      var lw=-lng*rad, phi=lat*rad;
      var n=Math.round(d-0.0009-lw/(2*Math.PI));
      var ds=0.0009+lw/(2*Math.PI)+n;
      var M=rad*(357.5291+0.98560028*ds);
      var C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
      var L=M+C+rad*102.9372+Math.PI;
      var dec=Math.asin(Math.sin(L)*Math.sin(e));
      var Jnoon=J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
      var h0=-0.833*rad;
      var cosH=(Math.sin(h0)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec));
      if(cosH>1) return false; if(cosH<-1) return true;
      var w=Math.acos(cosH);
      var a=0.0009+(w+lw)/(2*Math.PI)+n;
      var Jset=J2000+a+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
      var Jrise=Jnoon-(Jset-Jnoon);
      return now>=fromJ(Jrise)&&now<fromJ(Jset);
    }
    var light=p==="light"||(p!=="dark"&&day());
    var t=light?"light":"dark";
    var root=document.documentElement;
    root.dataset.theme=t;
    root.dataset.themePref=p||"auto";
    root.style.colorScheme=t;
  }catch(e){
    document.documentElement.dataset.theme="dark";
    document.documentElement.dataset.themePref="auto";
  }
})();
</script>

<link rel="icon" href="assets/icons/favicon.svg?v=hex2" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon.ico?v=hex2" sizes="any">

<style>
  html,body{max-width:100%;overscroll-behavior-x:none}
  .admin-wrap{
    max-width:1020px;width:100%;margin:0 auto;
    padding:28px max(24px, env(safe-area-inset-right)) 60px max(24px, env(safe-area-inset-left));
    box-sizing:border-box;
  }
  .admin-wrap > *{min-width:0;max-width:100%}
  #tableWrap{
    width:100%;max-width:100%;overflow-x:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  }
  table{width:100%;min-width:720px;border-collapse:collapse;font-size:var(--text-sm);margin-top:18px}
  th,td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top;color:var(--body);overflow-wrap:anywhere}
  th{color:var(--gold);font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--track-label);font-weight:400}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:18px 0 10px;max-width:100%}
  .toolbar .field{flex:1 1 200px;min-width:0;margin:0}
  .toolbar input{width:100%;box-sizing:border-box}
  .toolbar .btn{flex:0 0 auto}
  .login-card{
    max-width:420px;margin:28px 0 0;
    padding:22px 20px 24px;
    border:1px solid var(--line);
    background:linear-gradient(160deg,var(--panel-glass),var(--panel-wash-soft));
  }
  .login-card h2{
    font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;
    letter-spacing:var(--track-title);margin:0 0 14px;
  }
  .who-bar{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
    margin:14px 0 4px;
  }
  .who-bar .who{
    font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--track-label);color:var(--ash);
  }
  .who-bar .who b{color:var(--cyan);font-weight:600}
  code,.mono{font-family:var(--font-mono);color:var(--cyan)}
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 4px}
  .chip{
    font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--track-label);
    padding:7px 13px;border:1px solid var(--line);background:transparent;color:var(--ash);cursor:pointer;
    transition:border-color .18s,color .18s,background .18s;
  }
  .chip:hover{border-color:rgba(63,224,208,.45);color:var(--paper)}
  .chip[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:rgba(63,224,208,.08)}
  .filter-bar .spacer{flex:1}
  .row-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .row-actions .btn{clip-path:none;padding:7px 11px;font-size:var(--text-xs);white-space:nowrap}
  .status-pill{
    font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--track-label);
    padding:3px 8px;border:1px solid var(--line);display:inline-block;
  }
  .st-pending{color:var(--gold);border-color:rgba(214,178,102,.5)}
  .st-approved{color:var(--cyan);border-color:rgba(63,224,208,.5)}
  .st-rejected{color:var(--ash)}
  .credential{
    margin-top:14px;padding:16px 18px;
    border:1px solid rgba(63,224,208,.4);
    background:linear-gradient(135deg,var(--panel-glass),var(--panel-wash-soft));
  }
  .credential .k{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--track-label);color:var(--gold)}
  .credential .v{
    font-family:var(--font-mono);font-size:var(--text-lg);color:var(--cyan);
    user-select:all;overflow-wrap:anywhere;
  }
  .credential .grid{display:flex;gap:36px;flex-wrap:wrap;margin:8px 0 10px;min-width:0}
  .credential .grid > div{min-width:0}
  .muted{color:var(--ash)}
  .intent-block{display:flex;flex-direction:column;gap:4px;line-height:1.45}
  .intent-block .line strong{color:var(--paper);font-weight:600}
  .intent-join{
    font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:var(--track-label);
    display:inline-block;padding:2px 7px;border:1px solid var(--line);margin-right:6px;
  }
  .intent-join.yes{color:var(--cyan);border-color:rgba(63,224,208,.5)}
  .intent-join.no{color:var(--ash)}

  .perm-backdrop{
    position:fixed;inset:0;z-index:80;
    background:rgba(7,6,14,.72);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .perm-backdrop[hidden]{display:none!important}
  .perm-modal{
    width:min(440px,100%);
    background:var(--panel);border:1px solid var(--line);
    padding:22px 20px 18px;
    max-height:min(84vh,640px);overflow:auto;
  }
  .perm-modal h3{
    font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;
    letter-spacing:var(--track-title);margin:0 0 6px;
  }
  .perm-modal .sub{font-size:var(--text-sm);color:var(--ash);margin:0 0 16px;line-height:1.5}
  .perm-list{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
  .perm-item{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 12px;border:1px solid var(--line);background:var(--panel-2);
    cursor:pointer;user-select:none;
  }
  .perm-item:has(input:checked){border-color:var(--cyan);background:rgba(63,224,208,.08)}
  .perm-item input{margin-top:3px;accent-color:var(--cyan)}
  .perm-item .t{font-family:var(--font-display);font-size:var(--text-sm);font-weight:600;color:var(--paper)}
  .perm-item .d{font-size:var(--text-xs);color:var(--ash);margin-top:3px;line-height:1.4}
  .perm-note{
    font-size:var(--text-xs);color:var(--ash);line-height:1.5;margin:0 0 14px;
    padding:10px 12px;border-left:2px solid var(--gold);background:var(--panel-wash-soft);
  }
  .perm-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

  @media (max-width:640px){
    .admin-wrap{
      padding:22px max(16px, env(safe-area-inset-right)) 56px max(16px, env(safe-area-inset-left));
    }
    .filter-bar .spacer{display:none}
    #tableWrap{overflow-x:visible}
    table{min-width:0;display:block;margin-top:14px}
    thead{display:none}
    tbody{display:block}
    tr{
      display:block;margin-bottom:12px;
      border:1px solid var(--line);
      background:linear-gradient(160deg,var(--panel-glass),var(--panel-wash-soft));
    }
    td{
      display:block;border:0;padding:10px 14px;
      border-bottom:1px solid rgba(42,33,80,.6);
    }
    tr td:last-child{border-bottom:0}
    td::before{
      content:attr(data-label);
      display:block;margin-bottom:5px;
      font-family:var(--font-mono);font-size:var(--text-xs);
      letter-spacing:var(--track-label);color:var(--gold);
    }
    .row-actions{flex-direction:row;flex-wrap:wrap}
    .row-actions .btn{flex:1 1 auto}
    .credential .grid{gap:16px}
  }
</style>
</head>
<body>
<div class="admin-wrap">
  <a class="auth-nav" href="index.html" style="display:inline-block;border:0;padding:0;color:var(--cyan)">← 首页</a>
  <h1 style="font-family:var(--font-display);font-size:var(--text-xl);font-weight:700;margin:16px 0 8px;letter-spacing:var(--track-title)">报名审批</h1>
  <p class="muted" style="font-size:var(--text-base);line-height:var(--leading-body)">使用管理员账号登录后审批报名。<strong style="color:var(--paper);font-weight:600">批准</strong>会生成一次性通行码；用<strong style="color:var(--paper);font-weight:600">权限</strong>勾选可读的期次纪要（勾选任一期次即可查看使用心得）。通行码仅出现一次，请立刻私下发给申请人。</p>

  <div id="loginPanel" class="login-card" hidden>
    <h2>管理员登录</h2>
    <form id="loginForm">
      <div class="field">
        <label for="adminUser">账号</label>
        <input id="adminUser" name="username" required autocomplete="username" maxlength="40">
      </div>
      <div class="field">
        <label for="adminPass">密码</label>
        <input id="adminPass" name="password" type="password" required autocomplete="current-password" maxlength="64">
      </div>
      <div class="btn-row" style="margin-top:8px">
        <button class="btn btn-primary" type="submit" id="loginBtn">登录</button>
      </div>
    </form>
  </div>

  <div id="deskPanel" hidden>
    <div class="who-bar">
      <span class="who">已登录 · <b id="adminName">—</b></span>
      <button class="btn btn-ghost" type="button" id="logoutBtn" style="padding:8px 14px;font-size:var(--text-xs)">退出</button>
    </div>

    <div class="toolbar">
      <div class="field">
        <label>搜索</label>
        <input id="q" placeholder="称呼 / 登录名 / 地点 / 方向" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="loadBtn" type="button">刷新列表</button>
    </div>

    <div class="filter-bar" id="filterBar">
      <button class="chip" type="button" data-status="pending" aria-pressed="true">待审核</button>
      <button class="chip" type="button" data-status="approved" aria-pressed="false">已通过</button>
      <button class="chip" type="button" data-status="rejected" aria-pressed="false">已驳回</button>
      <button class="chip" type="button" data-status="" aria-pressed="false">全部</button>
      <span class="spacer"></span>
      <button class="chip" type="button" id="csvBtn">导出 CSV</button>
    </div>

    <div id="credential"></div>
    <div id="tableWrap"></div>
  </div>

  <div class="form-msg" id="msg" aria-live="polite"></div>
</div>

<div class="perm-backdrop" id="permBackdrop" hidden>
  <div class="perm-modal" role="dialog" aria-modal="true" aria-labelledby="permTitle">
    <h3 id="permTitle">设置权限</h3>
    <p class="sub" id="permSub">选择该成员可阅读的期次。</p>
    <div class="perm-note">勾选任意一期后，也可查看咒语手册里的「使用心得」。未勾选则仅有账号，看不到完整纪要与心得。</div>
    <div class="perm-list" id="permList"></div>
    <div class="perm-actions">
      <button type="button" class="btn btn-ghost" id="permCancel">取消</button>
      <button type="button" class="btn btn-primary" id="permSave">保存权限</button>
    </div>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script>
const msg = document.getElementById("msg");
const qInput = document.getElementById("q");
const tableWrap = document.getElementById("tableWrap");
const credentialBox = document.getElementById("credential");
const filterBar = document.getElementById("filterBar");
const loginPanel = document.getElementById("loginPanel");
const deskPanel = document.getElementById("deskPanel");
const adminName = document.getElementById("adminName");
const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");

let status = "pending";
let authed = false;
let gatheringCatalog = [];
let permTargetId = null;
let appsById = {};

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = s => CC.fmtChinaTime(s);

function setMsg(text, kind) {
  msg.className = "form-msg" + (kind ? " " + kind : "");
  msg.textContent = text;
}

function showGate(loggedIn, username) {
  authed = !!loggedIn;
  loginPanel.hidden = !!loggedIn;
  deskPanel.hidden = !loggedIn;
  adminName.textContent = username || "—";
  if (!loggedIn) {
    tableWrap.innerHTML = "";
    credentialBox.innerHTML = "";
  }
}

function showCredential(data, label) {
  credentialBox.innerHTML = `
    <div class="credential">
      <div class="k">${esc(label)} · ${esc(data.name)}</div>
      <div class="grid">
        <div><div class="k">登录名</div><div class="v">${esc(data.handle)}</div></div>
        <div><div class="k">通行码</div><div class="v">${esc(data.passcode)}</div></div>
      </div>
      <div class="muted" style="font-size:var(--text-sm)">
        可见期次：${esc((data.gatherings || []).join("、") || "暂未绑定")}　·　通行码仅此一次可见，请立即私下发送。
      </div>
    </div>`;
}

async function refreshAuth() {
  try {
    const me = await CC.api("/api/admin/me");
    showGate(me.auth, me.admin && me.admin.username);
    if (me.auth) await load();
    else setMsg("");
  } catch (err) {
    showGate(false);
    setMsg(err.message, "err");
  }
}

async function load() {
  if (!authed) return;
  setMsg("加载中…");
  const params = new URLSearchParams();
  if (status) params.set("status", status);
  if (qInput.value.trim()) params.set("q", qInput.value.trim());

  try {
    const data = await CC.api("/api/admin/applications?" + params);
    const c = data.counts || {};
    setMsg(`共 ${c.all || 0} 条报名　·　待审核 ${c.pending || 0}　已通过 ${c.approved || 0}　已驳回 ${c.rejected || 0}`);
    render(data.applications);
  } catch (err) {
    if (err.status === 403) {
      showGate(false);
      setMsg("登录已失效，请重新登录", "err");
      return;
    }
    setMsg(err.message, "err");
    tableWrap.innerHTML = "";
  }
}

function renderIntent(a) {
  const p = CC.parseIntent(a.intentDates);
  if (p.legacy && !p.joinNext) {
    return `
      <div class="intent-block">
        <div class="line">${esc(p.legacy)}</div>
        ${a.message ? `<div class="line muted">方向：${esc(a.message)}</div>` : ""}
      </div>`;
  }

  const joinClass = p.joinNext === "参加" ? "yes" : "no";
  const when = [p.period, p.slot].filter(Boolean).join(" · ");
  return `
    <div class="intent-block">
      <div class="line">
        <span class="intent-join ${joinClass}">${esc(p.joinNext || "—")}</span>
        <span class="muted">${esc(p.nextLabel || "最近一期")}</span>
      </div>
      ${when || p.area ? `<div class="line"><strong>${esc(when || "—")}</strong>${p.area ? ` · ${esc(p.area)}` : ""}</div>` : ""}
      ${a.message ? `<div class="line muted">方向：${esc(a.message)}</div>` : ""}
      ${p.note ? `<div class="line muted">补充：${esc(p.note)}</div>` : ""}
    </div>`;
}

function render(rows) {
  appsById = {};
  rows.forEach(a => { appsById[a.id] = a; });
  if (!rows.length) {
    tableWrap.innerHTML = "<p class='muted' style='margin-top:18px'>该筛选下暂无报名记录</p>";
    return;
  }
  tableWrap.innerHTML = `
    <table>
      <thead><tr>
        <th>提交时间</th><th>申请人</th><th>报名意向</th><th>状态</th><th>操作</th>
      </tr></thead>
      <tbody>
        ${rows.map(a => `
          <tr>
            <td class="muted" data-label="提交时间">${esc(fmtTime(a.createdAt))}</td>
            <td data-label="申请人">
              <strong style="color:var(--paper)">${esc(a.name)}</strong><br>
              <span class="mono">${esc(a.handle)}</span>
              ${a.contact ? `<br><span class="muted">${esc(a.contact)}</span>` : ""}
            </td>
            <td data-label="报名意向">${renderIntent(a)}</td>
            <td data-label="状态">
              <span class="status-pill st-${esc(a.status)}">${esc(a.status)}</span>
              ${(a.gatherings || a.issuedGatherings || []).length
                ? `<br><span class="muted">期次 ${esc((a.gatherings || a.issuedGatherings).join(","))}</span>` : ""}
              ${a.rejectReason ? `<br><span class="muted">${esc(a.rejectReason)}</span>` : ""}
            </td>
            <td data-label="操作">
              <div class="row-actions">
                ${a.status === "pending"
                  ? `<button class="btn btn-primary" data-act="approve" data-id="${esc(a.id)}">批准</button>` : ""}
                ${a.status === "approved"
                  ? `<button class="btn btn-ghost" data-act="reissue" data-id="${esc(a.id)}">重发通行码</button>` : ""}
                <button class="btn btn-ghost" data-act="permissions" data-id="${esc(a.id)}">权限</button>
              </div>
            </td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

async function ensureGatheringCatalog() {
  if (gatheringCatalog.length) return gatheringCatalog;
  try {
    const data = await CC.api("/api/gatherings");
    gatheringCatalog = (data.gatherings || []).map(g => ({
      id: String(g.id),
      title: g.title || `第 ${g.id} 期`,
      date: g.date || "",
      status: g.status || ""
    }));
  } catch (_) {
    gatheringCatalog = [{ id: "001", title: "赛博法师 • 第一期AI交流会", date: "2026.07.24", status: "past" }];
  }
  return gatheringCatalog;
}

async function openPermissions(id) {
  const appRow = appsById[id];
  if (!appRow) return;
  permTargetId = id;
  const catalog = await ensureGatheringCatalog();
  const selected = new Set(appRow.gatherings || appRow.issuedGatherings || []);
  document.getElementById("permSub").textContent =
    `${appRow.name}（${appRow.handle}）· 当前状态 ${appRow.status}`;
  document.getElementById("permList").innerHTML = catalog.map(g => `
    <label class="perm-item">
      <input type="checkbox" value="${esc(g.id)}" ${selected.has(g.id) ? "checked" : ""}>
      <span>
        <div class="t">${esc(g.id)} · ${esc(g.title)}</div>
        <div class="d">${esc([g.date, g.status === "upcoming" ? "待举办" : ""].filter(Boolean).join(" · "))}</div>
      </span>
    </label>`).join("");
  document.getElementById("permBackdrop").hidden = false;
}

function closePermissions() {
  permTargetId = null;
  document.getElementById("permBackdrop").hidden = true;
}

const actions = {
  async approve(id) {
    const data = await CC.api(`/api/admin/applications/${id}/approve`, {
      method: "POST", body: JSON.stringify({ gatherings: [] })
    });
    showCredential(data, "已批准");
  },
  async reissue(id) {
    if (!confirm("重发会作废旧通行码，确定？")) return;
    const data = await CC.api(`/api/admin/applications/${id}/reissue`, {
      method: "POST", body: "{}"
    });
    showCredential(data, "已重发通行码");
  },
  async permissions(id) {
    await openPermissions(id);
  }
};

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginBtn.disabled = true;
  setMsg("登录中…");
  try {
    const data = await CC.api("/api/admin/login", {
      method: "POST",
      body: JSON.stringify({
        username: document.getElementById("adminUser").value.trim(),
        password: document.getElementById("adminPass").value
      })
    });
    document.getElementById("adminPass").value = "";
    showGate(true, data.admin && data.admin.username);
    setMsg("登录成功", "ok");
    await load();
  } catch (err) {
    setMsg(err.message, "err");
  } finally {
    loginBtn.disabled = false;
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  try {
    await CC.api("/api/admin/logout", { method: "POST", body: "{}" });
  } catch (_) {}
  showGate(false);
  setMsg("已退出");
});

tableWrap.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  btn.disabled = true;
  try {
    await actions[act](btn.dataset.id);
    /* 打开权限弹层时不要立刻刷新，以免冲掉勾选状态 */
    if (act !== "permissions") await load();
  } catch (err) {
    setMsg(err.message, "err");
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("permCancel").addEventListener("click", closePermissions);
document.getElementById("permBackdrop").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) closePermissions();
});
document.getElementById("permSave").addEventListener("click", async () => {
  if (!permTargetId) return;
  const saveBtn = document.getElementById("permSave");
  saveBtn.disabled = true;
  try {
    const gatherings = [...document.querySelectorAll("#permList input[type=checkbox]:checked")]
      .map((el) => el.value);
    const data = await CC.api(`/api/admin/applications/${permTargetId}/permissions`, {
      method: "POST",
      body: JSON.stringify({ gatherings })
    });
    closePermissions();
    if (data.passcode) showCredential(data, "已设置权限并开通账号");
    else {
      setMsg(`已更新权限：${(data.gatherings || []).join("、") || "无期次"}`, "ok");
      credentialBox.innerHTML = "";
    }
    await load();
  } catch (err) {
    setMsg(err.message, "err");
  } finally {
    saveBtn.disabled = false;
  }
});

filterBar.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip[data-status]");
  if (!chip) return;
  status = chip.dataset.status;
  filterBar.querySelectorAll(".chip[data-status]").forEach(c => {
    c.setAttribute("aria-pressed", String(c === chip));
  });
  load();
});

document.getElementById("csvBtn").addEventListener("click", async () => {
  try {
    const res = await fetch("/api/admin/applications.csv", { credentials: "same-origin" });
    if (!res.ok) throw new Error("导出失败，请确认已登录");
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement("a");
    a.href = url;
    a.download = `报名表-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    setMsg(err.message, "err");
  }
});

document.getElementById("loadBtn").addEventListener("click", load);
qInput.addEventListener("keydown", e => { if (e.key === "Enter") load(); });
refreshAuth();
</script>
</body>
</html>
