<script>
(function(){
  try{
    var k="cc-theme";
    try{
      localStorage.removeItem(k);
      localStorage.removeItem("cc-lat");
      localStorage.removeItem("cc-lng");
    }catch(e){}
    var p=null;
    try{ p=sessionStorage.getItem(k); }catch(e){}
    if(p!=="light"&&p!=="dark") p=null;
    function day(){
      var lat=39.9042, lng=116.4074;
      var rad=Math.PI/180, dayMs=8.64e7, J1970=2440588, J2000=2451545, e=rad*23.4397;
      var now=new Date();
      var ymd=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).format(now);
      var noon=new Date(ymd+"T12:00:00+08:00");
      var toJ=function(d){return d/dayMs-0.5+J1970;};
      var fromJ=function(j){return new Date((j+0.5-J1970)*dayMs);};
      var d=toJ(noon)-J2000;
      var lw=-lng*rad, phi=lat*rad;
      var n=Math.round(d-0.0009-lw/(2*Math.PI));
      var ds=0.0009+lw/(2*Math.PI)+n;
      var M=rad*(357.5291+0.98560028*ds);
      var C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
      var L=M+C+rad*102.9372+Math.PI;
      var dec=Math.asin(Math.sin(L)*Math.sin(e));
      var Jnoon=J2000+ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
      var h0=-0.833*rad;
      var cosH=(Math.sin(h0)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec));
      if(cosH>1) return false; if(cosH<-1) return true;
      var w=Math.acos(cosH);
      var a=0.0009+(w+lw)/(2*Math.PI)+n;
      var Jset=J2000+a+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
      var Jrise=Jnoon-(Jset-Jnoon);
      return now>=fromJ(Jrise)&&now<fromJ(Jset);
    }
    var t=p||(day()?"light":"dark");
    var root=document.documentElement;
    var c=t==="light"?"#F5F3FB":"#07060E";
    root.dataset.theme=t;
    root.dataset.themePref=p||"auto";
    root.style.colorScheme=t;
    root.style.backgroundColor=c;
    var tm=document.createElement("meta");
    tm.name="theme-color";
    tm.content=c;
    document.head.appendChild(tm);
  }catch(e){
    document.documentElement.dataset.theme="dark";
    document.documentElement.dataset.themePref="auto";
    document.documentElement.style.backgroundColor="#07060E";
    document.documentElement.style.colorScheme="dark";
  }
})();
</script>

<script>
(function(){
  function appUrl(href){
    if(!href||href.charAt(0)==="#"||href.indexOf("mailto:")===0||href.indexOf("tel:")===0)return null;
    var u;try{u=new URL(href,location.href);}catch(err){return null;}
    if(u.origin!==location.origin)return null;
    var name=(u.pathname.replace(/\/+$/,"").split("/").pop()||"index.html");
    if(!(u.pathname==="/"||name===""||name==="index.html"||/^(apply|login|gathering-\d+|process)\.html$/i.test(name)))return null;
    return u;
  }
  function navTo(u,e){
    e.preventDefault();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    e.stopPropagation();
    if(window.CC&&CC.BGM&&CC.BGM.go){CC.BGM.go(u.href);return;}
    window.__ccPendingNav=u.href;
  }
  document.addEventListener("click",function(e){
    if(e.defaultPrevented)return;
    if(e.button&&e.button!==0)return;
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    var a=e.target.closest&&e.target.closest("a[href]");
    if(!a||a.target==="_blank"||a.hasAttribute("download"))return;
    var u=appUrl(a.getAttribute("href")||"");
    if(!u)return;
    navTo(u,e);
  },true);
  var touch0=null;
  document.addEventListener("touchstart",function(e){
    var t=e.changedTouches&&e.changedTouches[0];
    var a=e.target.closest&&e.target.closest("a[href]");
    touch0=t&&a?{x:t.clientX,y:t.clientY,a:a}:null;
  },{capture:true,passive:true});
  document.addEventListener("touchend",function(e){
    if(!touch0)return;
    var t=e.changedTouches&&e.changedTouches[0];
    var start=touch0;touch0=null;
    if(!t||Math.abs(t.clientX-start.x)>12||Math.abs(t.clientY-start.y)>12)return;
    var a=start.a;
    if(!a||a.target==="_blank"||a.hasAttribute("download"))return;
    var u=appUrl(a.getAttribute("href")||"");
    if(!u)return;
    navTo(u,e);
  },{capture:true,passive:false});
  var a=document.getElementById("bgm");
  if(!a)return;
  try{
    if(localStorage.getItem("cc-bgm")==="off")return;
    if(!(localStorage.getItem("cc-bgm")==="on"||sessionStorage.getItem("cc-bgm-playing")==="1"))return;
    var t=parseFloat(sessionStorage.getItem("cc-bgm-t")||"0")||0;
    var w=parseInt(sessionStorage.getItem("cc-bgm-wall")||"0",10);
    if(w) t+=Math.min(6,Math.max(0,(Date.now()-w)/1000));
    a.volume=0.42;
    var go=function(){
      try{
        var d=a.duration;
        if(isFinite(d)&&d>0) t=((t%d)+d)%d;
        if(Math.abs((a.currentTime||0)-t)>0.15) a.currentTime=Math.max(0,t);
      }catch(e){}
      var p=a.play();
      if(p&&p.catch)p.catch(function(){});
    };
    if(a.readyState>=1) go();
    else a.addEventListener("loadedmetadata",go,{once:true});
  }catch(e){}
})();
</script>

<script>
CC.BGM.init({ mode: "button", toggleId: "bgmBtn", gestureKick: true });

const form = document.getElementById("applyForm");
const msg = document.getElementById("msg");
const submitBtn = document.getElementById("submitBtn");
const handleCard = document.getElementById("handleCard");
const handleValue = document.getElementById("handleValue");
const intentPeriod = document.getElementById("intentPeriod");
const intentSlot = document.getElementById("intentSlot");
const intentArea = document.getElementById("intentArea");
const intentNote = document.getElementById("intentNote");
const intentDates = document.getElementById("intentDates");
const topicExtra = document.getElementById("topicExtra");
const messageField = document.getElementById("message");
const nextLabel = document.getElementById("nextLabel");

function syncChoiceState(input) {
  const label = input.closest(".choice");
  if (!label) return;
  if (input.type === "radio") {
    document.querySelectorAll(`input[type="radio"][name="${input.name}"]`).forEach((el) => {
      el.closest(".choice")?.classList.toggle("is-on", el.checked);
    });
    return;
  }
  label.classList.toggle("is-on", input.checked);
}
document.querySelectorAll(".choice input").forEach((el) => {
  el.addEventListener("change", () => syncChoiceState(el));
  if (el.checked) syncChoiceState(el);
});

/** DATA.nextGathering（如 2026.08.20 19:00）保持点分格式展示 */
function formatNextFull(raw) {
  const m = String(raw || "").match(/(\d{4})\.(\d{2})\.(\d{2})(?:\s+(\d{2}):(\d{2}))?/);
  if (!m) return raw || "第三期 · 9.19 下午 · 香港中环";
  const time = m[4] != null ? ` ${m[4]}:${m[5]}` : "";
  return `${m[1]}.${m[2]}.${m[3]}${time}`;
}

/** 从九月上旬起滚动生成「2026.09上旬/中旬/下旬」 */
function buildPeriodOptions(count = 6) {
  const bands = ["上旬", "中旬", "下旬"];
  let y = 2026;
  let m = 8; // 九月
  let band = 0; // 上旬
  const out = [];
  for (let i = 0; i < count; i++) {
    out.push(`${y}.${String(m + 1).padStart(2, "0")}${bands[band]}`);
    band += 1;
    if (band > 2) {
      band = 0;
      m += 1;
      if (m > 11) {
        m = 0;
        y += 1;
      }
    }
  }
  return out;
}

function fillPeriodOptions(keepValue) {
  const opts = ["2026.09.19", ...buildPeriodOptions(6)];
  const prev = keepValue || intentPeriod.value;
  intentPeriod.innerHTML = '<option value="" selected>日期</option>';
  for (const label of opts) {
    const o = document.createElement("option");
    o.value = label;
    o.textContent = label;
    intentPeriod.appendChild(o);
  }
  const flex = document.createElement("option");
  flex.value = "时间灵活";
  flex.textContent = "时间灵活";
  intentPeriod.appendChild(flex);
  if (prev && [...intentPeriod.options].some((o) => o.value === prev)) {
    intentPeriod.value = prev;
  }
}

const nextRaw = (typeof DATA !== "undefined" && DATA.nextGathering) || "第三期 · 9.19 下午 · 香港中环";
const nextFull = formatNextFull(nextRaw);
nextLabel.textContent = nextFull;
fillPeriodOptions();

function selectedJoinNext() {
  const el = form.querySelector('input[name="joinNext"]:checked');
  return el ? el.value : "";
}

function composeTopics() {
  return topicExtra.value.trim();
}

function composeIntent() {
  const join = selectedJoinNext();
  if (!join) return "";
  const period = intentPeriod.value;
  const slot = intentSlot.value;
  const area = intentArea.value;
  const note = intentNote.value.trim();
  let base = `最近一期（${nextFull}）：${join}`;
  if (period) base += `｜日期：${period}`;
  if (slot) base += `｜时段：${slot}`;
  if (area) base += `｜地点：${area}`;
  return note ? `${base}｜补充：${note}` : base;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "form-msg";
  msg.textContent = "提交中…";
  submitBtn.disabled = true;

  const composed = composeIntent();
  if (!composed) {
    msg.className = "form-msg err";
    msg.textContent = "请选择是否参加最近一期";
    submitBtn.disabled = false;
    return;
  }
  const topics = composeTopics();
  if (!topics) {
    msg.className = "form-msg err";
    msg.textContent = "请填写想交流的方向";
    topicExtra.focus();
    submitBtn.disabled = false;
    return;
  }
  intentDates.value = composed.slice(0, 200);
  messageField.value = topics.slice(0, 800);

  const body = Object.fromEntries(new FormData(form).entries());
  delete body.joinNext;

  try {
    const data = await CC.api("/api/apply", { method: "POST", body: JSON.stringify(body) });
    msg.className = "form-msg ok";
    msg.textContent = data.message || "已提交";
    if (data.handle) {
      handleValue.textContent = data.handle;
      handleCard.hidden = false;
      try { sessionStorage.setItem("cc-apply-handle", data.handle); } catch (_) {}
    }
    form.reset();
    nextLabel.textContent = nextFull;
    fillPeriodOptions();
  } catch (err) {
    msg.className = "form-msg err";
    msg.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
