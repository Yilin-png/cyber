<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="申请加入赛博法师 · 填写意向">
<meta name="theme-color" content="#07060E">
<title>申请加入 · 赛博法师</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
<style>
  /* 蜜罐：仅机器人会看到并填写 */
  .hp-field{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .handle-card{
    margin-top:18px;padding:16px 18px;
    border:1px solid rgba(63,224,208,.35);
    background:linear-gradient(135deg,rgba(16,12,33,.72),rgba(16,12,33,.24));
  }
  .handle-label{
    font-family:var(--font-mono);font-size:var(--text-xs);
    letter-spacing:var(--track-label);color:var(--gold);
  }
  .handle-value{
    font-family:var(--font-mono);font-size:var(--text-lg);
    color:var(--cyan);margin:6px 0 8px;user-select:all;word-break:break-all;
  }
  .field-row{
    display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px;
  }
  @media (max-width:720px){
    .field-row{grid-template-columns:1fr}
  }
  .field select{
    appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--ash) 50%),linear-gradient(135deg,var(--ash) 50%,transparent 50%);
    background-position:calc(100% - 16px) calc(50% - 2px),calc(100% - 11px) calc(50% - 2px);
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
    padding-right:28px;
  }
  .choice-row{
    display:flex;flex-wrap:wrap;gap:8px;
  }
  .choice{
    flex:1;min-width:96px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);background:var(--panel-2);
    color:var(--paper);font-family:var(--font-sans);font-size:var(--text-sm);
    padding:11px 12px;cursor:pointer;user-select:none;
  }
  .choice.topic{
    flex:0 1 auto;min-width:0;padding:9px 12px;font-size:var(--text-xs);
  }
  .choice:has(input:checked){
    border-color:var(--cyan);color:var(--cyan);background:rgba(63,224,208,.08);
  }
  .choice input{position:absolute;opacity:0;pointer-events:none}
</style>
</head>
<body class="auth-page">
  <div class="auth-nav wrap">
    <a href="index.html">← 返回首页</a>
    <a href="login.html">已有通行码？登录</a>
  </div>

  <div class="wrap" style="flex:1;display:flex;align-items:flex-start">
    <form class="auth-card" id="applyForm">
      <h1>我想参加</h1>
      <p class="lead">留下称呼与意向；通过后你会得到<strong style="color:var(--paper)">登录名</strong>和<strong style="color:var(--paper)">通行码</strong>，用来看纪要。</p>

      <div class="field">
        <label>怎么称呼你 *</label>
        <input name="name" required maxlength="40" placeholder="昵称即可" autocomplete="nickname">
      </div>

      <div class="field">
        <label>是否参加最近一期（<span id="nextLabel">2026年8月20日 19:00</span>）*</label>
        <div class="choice-row" role="radiogroup" aria-label="是否参加最近一期">
          <label class="choice"><input type="radio" name="joinNext" value="参加" required>参加</label>
          <label class="choice"><input type="radio" name="joinNext" value="不参加">不参加</label>
        </div>
      </div>

      <div class="field">
        <label>下一期意向时段 / 片区 *</label>
        <div class="field-row">
          <select id="intentPeriod" required>
            <option value="" disabled selected>日期区间</option>
          </select>
          <select id="intentSlot" required>
            <option value="" disabled selected>时段</option>
            <option value="工作日晚上">工作日晚上</option>
            <option value="周末上午">周末上午</option>
            <option value="周末下午">周末下午</option>
            <option value="周末晚上">周末晚上</option>
            <option value="周末全天">周末全天</option>
            <option value="时间灵活">时间灵活</option>
          </select>
          <select id="intentArea" required>
            <option value="" disabled selected>意向片区</option>
            <option value="南山·科技园">南山·科技园</option>
            <option value="南山·后海/深圳湾">南山·后海/深圳湾</option>
            <option value="福田·车公庙">福田·车公庙</option>
            <option value="福田·CBD">福田·CBD</option>
            <option value="罗湖">罗湖</option>
            <option value="宝安·前海">宝安·前海</option>
            <option value="龙华">龙华</option>
            <option value="龙岗/坂田">龙岗/坂田</option>
            <option value="不限片区">不限片区</option>
          </select>
        </div>
        <div class="hint">日期区间会随最近一期滚动更新；选大概方便的区间、时段和片区即可</div>
      </div>

      <input type="hidden" name="intentDates" id="intentDates">

      <div class="field">
        <label>联系方式（选填）</label>
        <input name="contact" maxlength="80" placeholder="手机、邮箱或微信等联系方式，方便通知">
        <div class="hint">建议填写，方便组织者联系</div>
      </div>

      <div class="field">
        <label>想交流的方向（选填）</label>
        <div class="choice-row" id="topicChips">
          <label class="choice topic"><input type="checkbox" value="信息获取与整理">信息获取与整理</label>
          <label class="choice topic"><input type="checkbox" value="Skill 封装与管理">Skill 封装与管理</label>
          <label class="choice topic"><input type="checkbox" value="本地知识库 / Obsidian">本地知识库 / Obsidian</label>
          <label class="choice topic"><input type="checkbox" value="编程与多 Agent">编程与多 Agent</label>
          <label class="choice topic"><input type="checkbox" value="会议纪要 / 语音转写">会议纪要 / 语音转写</label>
          <label class="choice topic"><input type="checkbox" value="办公写作与排版">办公写作与排版</label>
        </div>
        <textarea id="topicExtra" maxlength="400" placeholder="也可手填补充，例如：想聊 RAG 落地、本地模型部署…" style="margin-top:10px"></textarea>
        <input type="hidden" name="message" id="message">
      </div>

      <div class="field">
        <label>补充说明（选填）</label>
        <input id="intentNote" maxlength="80" placeholder="如：可推荐场地 / 指定某某咖啡厅附近">
      </div>

      <div class="hp-field" aria-hidden="true">
        <label>Website</label>
        <input name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" type="submit" id="submitBtn">提交意向</button>
        <a class="btn btn-ghost" href="login.html">去登录</a>
      </div>
      <div class="form-msg" id="msg" aria-live="polite"></div>
      <div class="handle-card" id="handleCard" hidden>
        <div class="handle-label">你的登录名</div>
        <div class="handle-value" id="handleValue"></div>
        <div class="hint">请先记下它。审核通过后组织者会私下发通行码，两者搭配登录。</div>
      </div>
    </form>
  </div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script>
const form = document.getElementById("applyForm");
const msg = document.getElementById("msg");
const submitBtn = document.getElementById("submitBtn");
const handleCard = document.getElementById("handleCard");
const handleValue = document.getElementById("handleValue");
const intentPeriod = document.getElementById("intentPeriod");
const intentSlot = document.getElementById("intentSlot");
const intentArea = document.getElementById("intentArea");
const intentNote = document.getElementById("intentNote");
const intentDates = document.getElementById("intentDates");
const topicExtra = document.getElementById("topicExtra");
const messageField = document.getElementById("message");
const nextLabel = document.getElementById("nextLabel");

/** DATA.nextGathering（如 2026.08.20 19:00）→ 2026年8月20日 19:00 */
function formatNextFull(raw) {
  const m = String(raw || "").match(/(\d{4})\.(\d{2})\.(\d{2})(?:\s+(\d{2}):(\d{2}))?/);
  if (!m) return raw || "近期线下";
  const year = m[1];
  const month = Number(m[2]);
  const day = Number(m[3]);
  const time = m[4] != null ? ` ${m[4]}:${m[5]}` : "";
  return `${year}年${month}月${day}日${time}`;
}

function parseNextDate(raw) {
  const m = String(raw || "").match(/(\d{4})\.(\d{2})\.(\d{2})/);
  if (!m) return new Date();
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}

/** 从基准日起滚动生成「X月上旬/中旬/下旬」 */
function buildPeriodOptions(fromDate, count = 6) {
  const bands = ["上旬", "中旬", "下旬"];
  let y = fromDate.getFullYear();
  let m = fromDate.getMonth();
  const day = fromDate.getDate();
  let band = day <= 10 ? 0 : day <= 20 ? 1 : 2;
  const out = [];
  for (let i = 0; i < count; i++) {
    out.push(`${y}年${m + 1}月${bands[band]}`);
    band += 1;
    if (band > 2) {
      band = 0;
      m += 1;
      if (m > 11) {
        m = 0;
        y += 1;
      }
    }
  }
  return out;
}

function fillPeriodOptions(keepValue) {
  const opts = buildPeriodOptions(parseNextDate(nextRaw), 6);
  const prev = keepValue || intentPeriod.value;
  intentPeriod.innerHTML = '<option value="" disabled selected>日期区间</option>';
  for (const label of opts) {
    const o = document.createElement("option");
    o.value = label;
    o.textContent = label;
    intentPeriod.appendChild(o);
  }
  const flex = document.createElement("option");
  flex.value = "时间灵活";
  flex.textContent = "时间灵活";
  intentPeriod.appendChild(flex);
  if (prev && [...intentPeriod.options].some((o) => o.value === prev)) {
    intentPeriod.value = prev;
  }
}

const nextRaw = (typeof DATA !== "undefined" && DATA.nextGathering) || "2026.08.20 19:00";
const nextFull = formatNextFull(nextRaw);
nextLabel.textContent = nextFull;
fillPeriodOptions();

function selectedJoinNext() {
  const el = form.querySelector('input[name="joinNext"]:checked');
  return el ? el.value : "";
}

function composeTopics() {
  const picked = [...form.querySelectorAll('#topicChips input:checked')].map((el) => el.value);
  const extra = topicExtra.value.trim();
  if (!picked.length && !extra) return "";
  if (!picked.length) return extra;
  if (!extra) return picked.join("、");
  return `${picked.join("、")}｜${extra}`;
}

function composeIntent() {
  const join = selectedJoinNext();
  const period = intentPeriod.value;
  const slot = intentSlot.value;
  const area = intentArea.value;
  const note = intentNote.value.trim();
  if (!join || !period || !slot || !area) return "";
  const base = `最近一期（${nextFull}）：${join}｜区间：${period}｜时段：${slot}｜片区：${area}`;
  return note ? `${base}｜补充：${note}` : base;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.className = "form-msg";
  msg.textContent = "提交中…";
  submitBtn.disabled = true;

  const composed = composeIntent();
  if (!composed) {
    msg.className = "form-msg err";
    msg.textContent = "请选择是否参加最近一期，以及日期区间、时段和片区";
    submitBtn.disabled = false;
    return;
  }
  intentDates.value = composed.slice(0, 200);
  messageField.value = composeTopics().slice(0, 800);

  const body = Object.fromEntries(new FormData(form).entries());
  delete body.joinNext;

  try {
    const data = await CC.api("/api/apply", { method: "POST", body: JSON.stringify(body) });
    msg.className = "form-msg ok";
    msg.textContent = data.message || "已提交";
    if (data.handle) {
      handleValue.textContent = data.handle;
      handleCard.hidden = false;
      try { sessionStorage.setItem("cc-apply-handle", data.handle); } catch (_) {}
    }
    form.reset();
    nextLabel.textContent = nextFull;
    fillPeriodOptions();
  } catch (err) {
    msg.className = "form-msg err";
    msg.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
